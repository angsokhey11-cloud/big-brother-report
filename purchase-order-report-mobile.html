<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fb"><title>BIG BROTHER — Purchase Order Report Mobile</title><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><style>
:root{--bg:#f4f7fb;--card:#fff;--line:#dce6f0;--text:#17304f;--muted:#708197;--navy:#17457a;--blue:#1f5fbf;--green:#198754;--red:#c93c46;--amber:#a86b00;--shadow:0 8px 24px rgba(23,63,119,.07)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}body{padding:10px 8px 24px}.app{max-width:760px;margin:auto}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:10px}.head h1{margin:0;font-size:19px;color:var(--navy)}.head p{margin:4px 0 0;font-size:9px;color:var(--muted);font-weight:700}.btn{border:0;border-radius:9px;padding:8px 10px;font-size:10px;font-weight:900}.btn.secondary{background:#eaf1f8;color:var(--navy)}.btn.primary{background:var(--blue);color:#fff}.btn.share{background:#229ed9;color:#fff}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:7px}.field label{display:block;font-size:7px;color:var(--muted);font-weight:900;text-transform:uppercase;margin-bottom:4px}.field input,.field select{width:100%;border:1px solid #cbd7e4;border-radius:8px;padding:9px;font-size:10px;background:#fff;color:var(--text)}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:9px}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:9px}.kpi{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;box-shadow:var(--shadow)}.kpi small{display:block;font-size:6.8px;color:var(--muted);font-weight:900;text-transform:uppercase}.kpi strong{display:block;margin-top:4px;font-size:14px;color:var(--navy)}.status{border-radius:9px;padding:8px 10px;font-size:9px;margin-bottom:8px;background:#eefaf3;color:#17754c}.status.error{background:#fff0f1;color:var(--red)}.client{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:9px}.clientHead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:10px;background:#f8fbff;border-bottom:1px solid var(--line)}.clientHead strong{font-size:12px;color:var(--navy)}.clientHead .total{font-size:11px;color:var(--green);font-weight:900}.code{font-size:7px;color:var(--muted);margin-top:2px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:9px}.metric{border:1px solid #e1e9f2;border-radius:9px;padding:8px}.metric small{display:block;font-size:6px;color:var(--muted);text-transform:uppercase;font-weight:900}.metric strong{display:block;font-size:9px;margin-top:3px}.section{border-top:1px solid var(--line)}.section summary{list-style:none;display:flex;justify-content:space-between;gap:8px;padding:9px 10px;background:#f9fbfd;color:var(--navy);font-size:9px;font-weight:900}.section summary::-webkit-details-marker{display:none}.row{padding:8px 10px;border-top:1px solid #edf1f5}.rowTop{display:flex;justify-content:space-between;gap:8px;font-size:9px;font-weight:900}.rowSub{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-top:5px;font-size:7.5px;color:var(--muted)}.money{color:var(--green)}.badge{display:inline-block;padding:3px 6px;border-radius:999px;background:#eef3f8;color:#566b80;font-size:7px;font-weight:900}.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:9px}.captureHead{padding:8px 10px;background:#173f77;color:#fff;border-radius:10px;margin-bottom:8px;display:none}.captureMode .captureHead{display:block}.captureMode .orderSection{display:none}.boot{position:fixed;inset:0;background:var(--bg);z-index:90;display:flex;align-items:center;justify-content:center;padding:18px}.boot.hidden{display:none}.bootCard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);font-size:12px;font-weight:900;color:var(--navy);text-align:center}.bootCard span{display:block;margin-top:5px;font-size:9px;color:var(--muted);font-weight:700}@media(max-width:390px){.toolbar,.actions{grid-template-columns:1fr}.metrics{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><div class="head"><div><h1>🧾 Purchase Order Report</h1><p>BIG BROTHER · monthly purchases by client</p></div><button class="btn secondary" id="backBtn">Back</button></div><div class="toolbar"><div class="field"><label>Report Month</label><input id="month" type="month"></div><div class="field"><label>Client Filter</label><select id="client"><option value="">All Clients</option></select></div></div><div class="actions"><button class="btn primary" id="loadBtn">Load</button><button class="btn secondary" id="saveBtn">🖼 Export</button><button class="btn share" id="shareBtn">✈ Share</button></div><div id="status" hidden></div><div id="capture"><div class="captureHead"><strong>BIG BROTHER — Purchase Order Report</strong><div id="captureMeta" style="font-size:8px;margin-top:3px;opacity:.85"></div></div><div class="kpis"><div class="kpi"><small>Total Purchases USD</small><strong id="totalUSD">$0.00</strong></div><div class="kpi"><small>Total Purchases KHR</small><strong id="totalKHR">៛0</strong></div><div class="kpi"><small>Outstanding Payable USD</small><strong id="payableUSD">$0.00</strong></div><div class="kpi"><small>Purchases / Clients</small><strong id="counts">0 / 0</strong></div></div><div id="clients"><div class="empty">Loading report…</div></div></div></div><div class="boot" id="boot"><div class="bootCard" id="bootCard">Loading Purchase Order Report<span>Checking BIG BROTHER permission</span></div></div><script>(async function(){'use strict';const SB='https://sjfhlaclgmkwwofzstok.supabase.co',KEY='sb_publishable_w762jR65CWwlO30fKQsYOw_6L9grx8S',SESSION_KEY='BB_SUPABASE_DEV_SESSION_V1';const $=id=>document.getElementById(id),num=v=>{const n=Number(v);return Number.isFinite(n)?n:0},esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),money=v=>'$'+num(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}),khr=v=>'៛'+num(v).toLocaleString(undefined,{maximumFractionDigits:0}),qty=v=>num(v).toLocaleString(undefined,{maximumFractionDigits:6});let session=null,data=null;function read(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(_){return null}}async function parse(r){const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch(_){d={message:t}}if(!r.ok)throw new Error(d.message||d.error_description||d.error||('Request failed ('+r.status+')'));return d}async function refresh(){const s=read();if(!s?.refresh_token)throw new Error('Please sign in to BIG BROTHER first.');const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});session=await parse(r);localStorage.setItem(SESSION_KEY,JSON.stringify(session))}async function ensure(){session=read();if(!session?.access_token)throw new Error('Please sign in to BIG BROTHER first.');if(session.expires_at&&Number(session.expires_at)<Math.floor(Date.now()/1000)+45)await refresh()}async function rpc(fn,args={}){await ensure();let r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(args),cache:'no-store'});if(r.status===401){await refresh();r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(args),cache:'no-store'})}return parse(r)}function key(v){return String(v||'').trim().toLowerCase()}async function permission(){const p=await rpc('bb_current_access_profile');const g=(p?.modules||[]).find(x=>key(x.moduleKey)==='route.purchase-order-report');if(!g?.canView)throw new Error('Purchase Order Report View permission is required.')}function status(t,e=false){$('status').hidden=!t;$('status').className='status'+(e?' error':'');$('status').textContent=t||''}function ckey(c){return String(c.clientId||c.clientCode||c.clientName||'')}function visible(){const v=$('client').value;return v?(data?.clients||[]).filter(c=>ckey(c)===v):(data?.clients||[])}function totals(list){return list.reduce((a,c)=>{a.purchaseCount+=num(c.purchaseCount);a.totalUSD+=num(c.totalUSD);a.totalKHR+=num(c.totalKHR);a.payableUSD+=num(c.payableUSD);return a},{purchaseCount:0,totalUSD:0,totalKHR:0,payableUSD:0})}function render(){const list=visible(),t=totals(list);$('totalUSD').textContent=money(t.totalUSD);$('totalKHR').textContent=khr(t.totalKHR);$('payableUSD').textContent=money(t.payableUSD);$('counts').textContent=`${t.purchaseCount} / ${list.length}`;$('captureMeta').textContent=`${data?.periodLabel||''} · ${$('client').selectedOptions[0]?.textContent||'All Clients'}`;$('clients').innerHTML=list.length?list.map(c=>`<section class="client"><div class="clientHead"><div><strong>${esc(c.clientName||'-')}</strong><div class="code">${esc(c.clientCode||c.clientId||'-')}</div></div><div class="total">${money(c.totalUSD)}</div></div><div class="metrics"><div class="metric"><small>Purchase Orders</small><strong>${qty(c.purchaseCount)}</strong></div><div class="metric"><small>Total USD</small><strong>${money(c.totalUSD)}</strong></div><div class="metric"><small>Total KHR</small><strong>${khr(c.totalKHR)}</strong></div><div class="metric"><small>Payable USD</small><strong>${money(c.payableUSD)}</strong></div></div><details class="section" open><summary><span>📦 Product Summary</span><span>${(c.items||[]).length} SKU</span></summary>${(c.items||[]).map(x=>`<div class="row"><div class="rowTop"><span>${esc(x.sku||'-')}</span><span class="money">${money(x.amountUSD)}</span></div><div class="rowSub"><span>${esc(x.productName||'')}</span><span>${esc(x.unit||'-')}</span><span>Qty ${qty(x.qty)}</span><span>Promo ${qty(x.promotionQty)}</span><span>KHR ${khr(x.amountKHR)}</span></div></div>`).join('')||'<div class="empty">No product items.</div>'}</details><details class="section orderSection"><summary><span>🧾 Purchase Order Details</span><span>${qty(c.purchaseCount)} orders</span></summary>${(c.purchases||[]).map(x=>`<div class="row"><div class="rowTop"><span>${esc(x.purchaseId||'-')}</span><span class="badge">${esc(x.paymentStatus||'-')}</span></div><div class="rowSub"><span>${esc(x.purchaseDate||'-')}</span><span>${esc(x.clientInvoiceNo||'-')}</span><span>${esc(x.currency||'-')}</span><span>Grand ${String(x.currency||'').toUpperCase()==='KHR'?khr(x.grandTotal):money(x.grandTotal)}</span><span>Payable ${String(x.currency||'').toUpperCase()==='KHR'?khr(x.payable):money(x.payable)}</span></div></div>`).join('')||'<div class="empty">No purchase orders.</div>'}</details></section>`).join(''):'<div class="empty">No purchases for this view.</div>'}async function load(){const m=$('month').value.match(/^(\d{4})-(\d{2})$/);if(!m)return status('Choose a report month.',true);$('loadBtn').disabled=true;try{data=await rpc('bb_report_purchase_orders_monthly',{p_year:+m[1],p_month:+m[2]});$('client').innerHTML='<option value="">All Clients</option>'+[...(data.clients||[])].sort((a,b)=>String(a.clientName||'').localeCompare(String(b.clientName||''))).map(c=>`<option value="${esc(ckey(c))}">${esc(c.clientName)}${c.clientCode?' — '+esc(c.clientCode):''}</option>`).join('');render();status(`${data.periodLabel||''} · ${(data.clients||[]).length} client(s) · Generated ${data.generatedAt||''}`);$('boot').classList.add('hidden')}catch(e){status(e?.message||e,true);$('bootCard').innerHTML='Could not open Purchase Order Report<span>'+esc(e?.message||e)+'</span>'}finally{$('loadBtn').disabled=false}}async function blob(){if(!data)throw new Error('Load the report first.');document.body.classList.add('captureMode');await new Promise(r=>setTimeout(r,50));const c=await html2canvas($('capture'),{backgroundColor:'#f4f7fb',scale:2,useCORS:true});document.body.classList.remove('captureMode');return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('Could not create picture.')),'image/png',1))}async function save(){try{const b=await blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`BIG-BROTHER-Purchase-${$('month').value}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);status('Purchase Report picture saved.')}catch(e){status(e.message||e,true)}}async function share(){try{const b=await blob(),f=new File([b],`BIG-BROTHER-Purchase-${$('month').value}.png`,{type:'image/png'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]}))){await navigator.share({title:'BIG BROTHER Purchase Order Report',text:data?.periodLabel||'Monthly Purchase Report',files:[f]});status('Share menu opened — choose Telegram.')}else{await save();status('Picture saved. Attach it in Telegram.')}}catch(e){if(e?.name!=='AbortError')status(e.message||e,true)}}$('month').value=new Date().toISOString().slice(0,7);$('client').onchange=render;$('loadBtn').onclick=load;$('saveBtn').onclick=save;$('shareBtn').onclick=share;$('backBtn').onclick=()=>history.back();try{await permission();await load()}catch(e){$('bootCard').innerHTML='Could not open Purchase Order Report<span>'+esc(e?.message||e)+'</span>'}})();</script></body></html>
