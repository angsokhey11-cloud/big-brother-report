<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f7fb"><title>BIG BROTHER — Income Statement Mobile</title><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><style>
:root{--bg:#f4f7fb;--card:#fff;--line:#dce6f0;--text:#17304f;--muted:#708197;--navy:#17457a;--blue:#1f5fbf;--green:#087a55;--purple:#4b2abf;--orange:#b85d00;--red:#c93c46;--shadow:0 8px 24px rgba(23,63,119,.07)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}body{padding:10px 8px 24px}.app{max-width:760px;margin:auto}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:9px}.head h1{margin:0;font-size:19px;color:var(--navy)}.head p{margin:4px 0 0;font-size:9px;color:var(--muted);font-weight:700}.btn{border:0;border-radius:9px;padding:8px 10px;font-size:10px;font-weight:900}.btn.secondary{background:#eaf1f8;color:var(--navy)}.btn.primary{background:var(--blue);color:#fff}.btn.share{background:#239adf;color:#fff}.toolbar{display:grid;grid-template-columns:1fr auto;gap:7px;margin-bottom:7px}.field label{display:block;font-size:7px;color:var(--muted);font-weight:900;text-transform:uppercase;margin-bottom:4px}.field input{width:100%;border:1px solid #cbd7e4;border-radius:8px;padding:9px;font-size:10px;background:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}.capture{background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px;box-shadow:var(--shadow)}.brand{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:2px 2px 7px}.brand h2{margin:0;font-size:13px;color:var(--navy)}.brand p,.period{margin:3px 0 0;font-size:6.8px;color:var(--muted);font-weight:700}.kpis{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:7px}.kpi{border:1px solid var(--line);border-radius:8px;padding:6px 7px;min-height:48px}.kpi small{font-size:5.9px;color:var(--muted);font-weight:900;text-transform:uppercase}.kpi strong{display:block;margin-top:3px;font-size:11.5px;line-height:1.05}.kpi.sale{background:#edf5ff}.kpi.sale strong{color:var(--blue)}.kpi.gross{background:#eefaf5}.kpi.gross strong{color:var(--green)}.kpi.net{background:#f4f0ff}.kpi.net strong{color:var(--purple)}.kpi.ret{background:#fff7ec}.kpi.ret strong{color:var(--orange)}.block{border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:6px;background:#fff}.block summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 9px;background:#edf5ff;color:var(--navy);font-size:9px;font-weight:900;cursor:pointer}.block summary::-webkit-details-marker{display:none}.block summary .title{display:flex;align-items:center;gap:6px}.block summary .title:before{content:'＋';font-size:11px;color:#54718e}.block[open] summary .title:before{content:'−'}.blockBody{background:#fff}.line{display:flex;justify-content:space-between;gap:10px;padding:7px 9px;border-top:1px solid #edf1f5;font-size:8.5px}.line span:last-child{font-weight:900;white-space:nowrap}.line.indent{padding-left:19px}.line.total{background:#f8fbff;font-weight:900}.line.strong{background:#edf5ff;font-size:9px;font-weight:900}.line.net{background:#e9f3ff;color:var(--blue);font-size:11px;font-weight:900;border-radius:8px;margin:2px 0 6px}.line.retained{background:#eefaf5;color:var(--green);font-size:11px;font-weight:900;border-radius:8px}.status{border-radius:9px;padding:8px 10px;font-size:9px;margin-bottom:8px;background:#eefaf3;color:#17754c}.status.error{background:#fff0f1;color:var(--red)}.empty{color:var(--muted);font-style:italic}.boot{position:fixed;inset:0;background:var(--bg);z-index:90;display:flex;align-items:center;justify-content:center;padding:18px}.boot.hidden{display:none}.bootCard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);font-size:12px;font-weight:900;color:var(--navy);text-align:center}.bootCard span{display:block;margin-top:5px;font-size:9px;color:var(--muted);font-weight:700}
</style></head><body><div class="app"><div class="head"><div><h1>📈 Income Statement</h1><p>BIG BROTHER · monthly management statement</p></div><button class="btn secondary" id="backBtn">Back</button></div><div class="toolbar"><div class="field"><label>Report Month</label><input id="month" type="month"></div><button class="btn primary" id="loadBtn">Load</button></div><div class="actions"><button class="btn secondary" id="saveBtn">📷 Save Picture</button><button class="btn share" id="shareBtn">✈ Share</button></div><div id="status" hidden></div><div id="capture" class="capture"><div class="brand"><div><h2>BIG BROTHER — Income Statement</h2><p>Management Statement · USD Reporting</p></div><div class="period" id="period">Monthly</div></div><div class="kpis"><div class="kpi sale"><small>Total Sale</small><strong id="totalSale">$0.00</strong></div><div class="kpi gross"><small>Gross Profit</small><strong id="grossProfit">$0.00</strong></div><div class="kpi net"><small>Net Income</small><strong id="netIncome">$0.00</strong></div><div class="kpi ret"><small>Retained Earnings</small><strong id="retained">$0.00</strong></div></div><div id="statement"><div class="line empty">Loading statement…</div></div></div></div><div class="boot" id="boot"><div class="bootCard" id="bootCard">Loading Income Statement<span>Checking BIG BROTHER permission</span></div></div><script>(async function(){'use strict';const SB='https://sjfhlaclgmkwwofzstok.supabase.co',KEY='sb_publishable_w762jR65CWwlO30fKQsYOw_6L9grx8S',SESSION_KEY='BB_SUPABASE_DEV_SESSION_V1';const $=id=>document.getElementById(id),num=v=>{const n=Number(v);return Number.isFinite(n)?n:0},esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),money=v=>'$'+num(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});let session=null,last=null;function read(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch(_){return null}}async function parse(r){const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch(_){d={message:t}}if(!r.ok)throw new Error(d.message||d.error_description||d.error||('Request failed ('+r.status+')'));return d}async function refresh(){const s=read();if(!s?.refresh_token)throw new Error('Please sign in to BIG BROTHER first.');const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token})});session=await parse(r);localStorage.setItem(SESSION_KEY,JSON.stringify(session))}async function ensure(){session=read();if(!session?.access_token)throw new Error('Please sign in to BIG BROTHER first.');if(session.expires_at&&Number(session.expires_at)<Math.floor(Date.now()/1000)+45)await refresh()}async function rpc(fn,args={}){await ensure();let r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(args),cache:'no-store'});if(r.status===401){await refresh();r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+session.access_token,'Content-Type':'application/json'},body:JSON.stringify(args),cache:'no-store'})}return parse(r)}function key(v){return String(v||'').trim().toLowerCase()}async function permission(){const p=await rpc('bb_current_access_profile');const g=(p?.modules||[]).find(x=>key(x.moduleKey)==='route.income-statement-report');if(!g?.canView)throw new Error('Income Statement View permission is required.')}function status(t,e=false){$('status').hidden=!t;$('status').className='status'+(e?' error':'');$('status').textContent=t||''}function line(label,value,cls=''){return `<div class="line ${cls}"><span>${esc(label)}</span><span>${money(value)}</span></div>`}function block(title,body,total,open=false){return `<details class="block"${open?' open':''}><summary><span class="title">${esc(title)}</span><span>${total==null?'':money(total)}</span></summary><div class="blockBody">${body}</div></details>`}function cats(sec){const a=Array.isArray(sec?.categories)?sec.categories:[];return a.length?a.map(x=>line(x.category,x.amountUSD,'indent')).join(''):'<div class="line indent empty"><span>No activity</span><span>$0.00</span></div>'}function render(d){last=d;const s=d.statement||{},locs=d.salesLocations||[],secs=d.expenseSections||[],op=secs.find(x=>x.expenseType==='OPERATING EXPENSE')||{},non=secs.find(x=>x.expenseType==='NON-OPERATING EXPENSE')||{},cap=secs.find(x=>x.expenseType==='CAPITAL EXPENSE')||{},wd=d.withdrawalSection||{};$('totalSale').textContent=money(s.totalSalesUSD);$('grossProfit').textContent=money(s.grossProfitUSD);$('netIncome').textContent=money(s.netIncomeUSD);$('retained').textContent=money(s.retainedEarningsUSD);$('period').textContent=(d.periodLabel||'Monthly')+(d.generatedAt?' · '+d.generatedAt:'');const sales=(locs.length?locs.map(x=>line(x.locationName||x.locationCode,x.grossSalesUSD,'indent')).join(''):'<div class="line indent empty"><span>No sales</span><span>$0.00</span></div>')+line('Gross Sales',s.totalSalesUSD,'total')+line('Sales Returns',-num(s.salesReturnsUSD),'indent')+line('Net Sales',s.netSalesUSD,'strong');$('statement').innerHTML=block('Sales',sales,s.netSalesUSD,true)+block('Cost of Goods Sold',line('COGS',s.cogsUSD,'indent')+line('Gross Profit',s.grossProfitUSD,'strong'),s.cogsUSD)+block('Operating Expense',cats(op)+line('Income After Operating Expense',s.incomeAfterOperatingExpenseUSD,'strong'),op.totalAmountUSD)+block('Non-Operating Expense',cats(non)+line('Income After Non-Operating Expense',s.incomeAfterNonOperatingExpenseUSD,'strong'),non.totalAmountUSD)+block('Capital Expense',cats(cap),cap.totalAmountUSD)+line('Net Income',s.netIncomeUSD,'net')+block('Withdrawal',cats(wd),wd.totalAmountUSD)+line('Retained Earnings',s.retainedEarningsUSD,'retained');status(`${d.periodLabel||''} · Generated ${d.generatedAt||''}`)}async function load(){const m=$('month').value.match(/^(\d{4})-(\d{2})$/);if(!m)return status('Choose a report month.',true);$('loadBtn').disabled=true;try{render(await rpc('bb_report_income_statement',{p_year:+m[1],p_month:+m[2]}));$('boot').classList.add('hidden')}catch(e){status(e?.message||e,true);$('bootCard').innerHTML='Could not open Income Statement<span>'+esc(e?.message||e)+'</span>'}finally{$('loadBtn').disabled=false}}async function blob(){if(!last)throw new Error('Load the statement first.');if(typeof html2canvas!=='function')throw new Error('Picture generator is still loading.');const c=await html2canvas($('capture'),{backgroundColor:'#fff',scale:2,useCORS:true});return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('Could not create picture.')),'image/png',1))}async function save(){try{const b=await blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`BIG-BROTHER-Income-Statement-${$('month').value}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);status('Income Statement picture saved.')}catch(e){status(e.message||e,true)}}async function share(){try{const b=await blob(),f=new File([b],`BIG-BROTHER-Income-Statement-${$('month').value}.png`,{type:'image/png'});if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[f]}))){await navigator.share({title:'BIG BROTHER Income Statement',text:last?.periodLabel||'Monthly Income Statement',files:[f]});status('Share menu opened — choose Telegram.')}else{await save();status('Picture saved. Attach it in Telegram.')}}catch(e){if(e?.name!=='AbortError')status(e.message||e,true)}}$('month').value=new Date().toISOString().slice(0,7);$('loadBtn').onclick=load;$('saveBtn').onclick=save;$('shareBtn').onclick=share;$('backBtn').onclick=()=>history.back();try{await permission();await load()}catch(e){$('bootCard').innerHTML='Could not open Income Statement<span>'+esc(e?.message||e)+'</span>'}})();</script></body></html>
